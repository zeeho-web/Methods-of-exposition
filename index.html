    let shuffledTechniques=[], shuffledMnemonics=[];
    function refreshShuffledLists() { shuffledTechniques=shuffleArray(TECH_DATA.map(t=>t.name)); shuffledMnemonics=shuffleArray(TECH_DATA.map(t=>t.mnemonic)); }
    const QUESTIONS = [
        { passage: "「北極星就像夜空中永恆的指路燈塔，始終高掛北方，幫助旅人辨認方向。」這段話運用了甚麼說明手法？", correctTech: "比喻說明", techOptions: ["比喻說明","分類說明","數字說明","引用說明"], purposeOrTargetQ: "這段文字最主要說明的對象和目的是甚麼？", targetOptions: ["說明北極星的形狀大小","說明北極星像燈塔一樣能指引方向","說明燈塔的建造方式","說明夜空中的星星數量"], correctTargetIndex: 1 },
        { passage: "「和傳統燃油車相比，電動車少了引擎震動與排廢氣，行駛更安靜，加速也更線性，但續航里程仍略遜一籌。」", correctTech: "比較說明", techOptions: ["比較說明","定義說明","舉例說明","描述說明"], purposeOrTargetQ: "這段文字主要是想說明甚麼？", targetOptions: ["說明電動車的充電時間","說明電動車與燃油車的特性差異","說明電動車的外觀設計","說明燃油車的歷史演變"], correctTargetIndex: 1 },
        { passage: "「天氣預報中的降雨強度可分為：小雨（每小時累積雨量小於2.5mm）、大雨（每小時15-40mm）以及豪雨（每小時超過40mm）。」", correctTech: "分類說明", techOptions: ["分類說明","比喻說明","數字說明","引用說明"], purposeOrTargetQ: "這段文字說明的重點是甚麼？", targetOptions: ["說明降雨強度的三種分類與標準","說明豪雨造成的災害","說明世界各地的雨量紀錄","說明雨傘的選擇方式"], correctTargetIndex: 0 },

        { passage: "「根據《全球風險報告》指出：『極端氣候已成為未來十年最嚴重的威脅』，世界氣象組織也呼籲各國加速減碳。」", correctTech: "引用說明", techOptions: ["引用說明","數字說明","分類說明","描述說明"], purposeOrTargetQ: "這段文字主要的目的是甚麼？", targetOptions: ["引用權威報告與組織說法，增加極端氣候威脅的可信度","具體描述極端氣候的畫面","分類不同氣候類型","統計碳排放數字"], correctTargetIndex: 0 },
        { passage: "「清晨的森林，薄霧如紗，樹葉掛滿露珠，空氣中瀰漫著濕潤的青草香，偶爾傳來清脆的鳥鳴，寧靜而充滿生機。」", correctTech: "描述說明", techOptions: ["描述說明","定義說明","比較說明","舉例說明"], purposeOrTargetQ: "這段文字說明的焦點是甚麼？", targetOptions: ["透過感官摹寫描繪森林清晨的景色與氛圍","比較不同森林的差異","引用植物學知識","統計森林面積"], correctTargetIndex: 0 },
        { passage: "「人類的記憶系統就像一座大型倉庫，短期記憶是臨時的卸貨區，長期記憶則是永久貨架，資訊必須經過整理才能存放。」", correctTech: "比喻說明", techOptions: ["比喻說明","分類說明","數字說明","定義說明"], purposeOrTargetQ: "這段文字想要說明甚麼？", targetOptions: ["倉庫的運作方式","記憶系統中短期記憶與長期記憶的關係（用倉庫比擬）","貨架的種類","記憶容量的數據"], correctTargetIndex: 1 },
        { passage: "「有線滑鼠和無線滑鼠相比，有線滑鼠反應零延遲且價格便宜，但會被線材限制；無線滑鼠桌面簡潔但需要充電或換電池。」", correctTech: "比較說明", techOptions: ["比較說明","舉例說明","描述說明","引用說明"], purposeOrTargetQ: "這段文字主要說明的目的是？", targetOptions: ["比較兩種滑鼠的優缺點與差異","推薦某個滑鼠品牌","介紹滑鼠發明歷史","列出滑鼠銷售數字"], correctTargetIndex: 0 },
        { passage: "「根據教育部的調查，國中生每天平均使用手機2.7小時，假日更長達4.2小時，其中社群軟體佔比最高達65%。」", correctTech: "數字說明", techOptions: ["數字說明","分類說明","比喻說明","描述說明"], purposeOrTargetQ: "作者使用這些數字，主要是想說明甚麼？", targetOptions: ["說明國中生手機使用時長及社群佔比的具體狀況","指出手機品牌的市佔率","說明社群軟體的功能","列出國中生在校成績"], correctTargetIndex: 0 },
        { passage: "「許多國家推動無現金消費，例如：瑞典有超過98%的交易使用電子支付；中國大陸的微信支付和支付寶普及率極高；南韓也推行零錢不用找的政策。」", correctTech: "舉例說明", techOptions: ["舉例說明","定義說明","比較說明","數字說明"], purposeOrTargetQ: "這段文字說明的重點是甚麼？", targetOptions: ["列舉瑞典、中國、南韓等例子來說明各國推動無現金消費的做法","比較電子支付的優劣","定義『無現金』一詞","描述鈔票的演進"], correctTargetIndex: 0 },

        { passage: "「古生物學家可以將恐龍分為兩大類：鳥臀目（如三角龍）和蜥臀目（如暴龍、腕龍），前者具有鳥類般的骨盆結構。」", correctTech: "分類說明", techOptions: ["分類說明","比較說明","數字說明","描述說明"], purposeOrTargetQ: "這段文字主要說明目的是？", targetOptions: ["介紹恐龍的兩大類別與代表例子","指出恐龍的滅絕原因","說明恐龍的體重數字","說明鳥類的演化過程"], correctTargetIndex: 0 },

    let selectedTechnique = null, pairs = [];

        if(!tc||!mc) return;
        tc.innerHTML=''; shuffledTechniques.forEach(techName=>{const m=pairs.find(p=>p.techName===techName); const d=document.createElement('div'); d.className=`drag-item ${selectedTechnique===techName?'selected':''}${m?' matched':''}`; d.innerText=techName; if(!m)d.onclick=e=>{e.stopPropagation(); selectedTechnique=techName; renderMatchGame();}; tc.appendChild(d);});
        mc.innerHTML=''; shuffledMnemonics.forEach(mText=>{const m=pairs.find(p=>p.mnemonic===mText); const d=document.createElement('div'); d.className=`drag-item${m?' matched':''}`; d.innerText=mText; if(!m)d.onclick=()=>{if(selectedTechnique){if(pairs.some(p=>p.techName===selectedTechnique)){document.getElementById('matchResult').innerHTML='⚠️ 這個手法已經配對過了！'; selectedTechnique=null; renderMatchGame(); return;} if(pairs.some(p=>p.mnemonic===mText)){document.getElementById('matchResult').innerHTML='⚠️ 這個口訣已經被配對了！'; selectedTechnique=null; renderMatchGame(); return;} const correct=getOriginalMnemonic(selectedTechnique); if(correct===mText){pairs.push({techName:selectedTechnique,mnemonic:mText}); document.getElementById('matchResult').innerHTML=`✅ 正確配對！「${selectedTechnique} ↔ ${mText}」`;} else{document.getElementById('matchResult').innerHTML=`❌ 配對錯誤！「${selectedTechnique}」 的正確口訣是「${correct}」`;} selectedTechnique=null; renderMatchGame(); updatePairedSummary();} else{document.getElementById('matchResult').innerHTML='👆 請先點選左邊「說明手法」';}}; mc.appendChild(d);});
    }
    function updatePairedSummary(){const s=document.getElementById('pairedSummary'); if(s)s.innerHTML=pairs.length===TECH_DATA.length?'🎉 完美！所有手法與口訣都配對成功！ 🎉':`📌 已配對 ${pairs.length} / ${TECH_DATA.length} 組，繼續加油！`;}
    function resetMatch(){pairs=[]; selectedTechnique=null; refreshShuffledLists(); renderMatchGame(); document.getElementById('matchResult').innerHTML='🔄 已清除所有配對，順序已重新打亂！'; updatePairedSummary();}
    let currentQIndex=0, userTechAns=Array(QUESTIONS.length).fill(null), userTargetAns=Array(QUESTIONS.length).fill(null), techCorrectArr=Array(QUESTIONS.length).fill(false), targetCorrectArr=Array(QUESTIONS.length).fill(false);
    function computeTotal(){let t=0; for(let i=0;i<QUESTIONS.length;i++){if(techCorrectArr[i])t++; if(targetCorrectArr[i])t++;} return t;}
    function updateScoreUI(){document.getElementById('totalScoreSpan').innerText=computeTotal();}
    function renderCurrentQuiz(){const q=QUESTIONS[currentQIndex]; const c=document.getElementById('dynamicQuizArea'); if(!c)return; const sti=userTechAns[currentQIndex], stai=userTargetAns[currentQIndex]; c.innerHTML=`<div class="passage-card">📄 ${q.passage}</div><div class="questions-panel"><div class="sub-q"><div class="q-title">🔍 <strong>【第一關】</strong> 這段文字使用了哪一種說明手法？</div><div class="option-group" id="techOptionsContainer"></div><div id="techFeedback" class="feedback-area"></div></div><div class="sub-q"><div class="q-title">🎯 <strong>【第二關】</strong> ${q.purposeOrTargetQ}</div><div class="option-group" id="targetOptionsContainer"></div><div id="targetFeedback" class="feedback-area"></div></div></div><div class="nav-buttons"><button id="prevBtn">◀ 上一題</button><button id="nextBtn" class="next-btn">下一題 ▶</button><button id="resetQuizBtn">🔄 全部重測</button></div>`;
        const tcd=document.getElementById('techOptionsContainer');['A','B','C','D'].forEach((l,i)=>{const b=document.createElement('div'); b.className=`option-btn ${sti===i?'opt-selected':''}`; b.innerHTML=`<span class="opt-letter">${l}</span><span>${q.techOptions[i]}</span>`; b.onclick=()=>{if(userTechAns[currentQIndex]!==i){userTechAns[currentQIndex]=i; techCorrectArr[currentQIndex]=(q.techOptions[i]===q.correctTech); renderCurrentQuiz(); updateScoreUI();}}; tcd.appendChild(b);});
        const tad=document.getElementById('targetOptionsContainer');['A','B','C','D'].forEach((l,i)=>{const b=document.createElement('div'); b.className=`option-btn ${stai===i?'opt-selected':''}`; b.innerHTML=`<span class="opt-letter">${l}</span><span>${q.targetOptions[i]}</span>`; b.onclick=()=>{if(userTargetAns[currentQIndex]!==i){userTargetAns[currentQIndex]=i; targetCorrectArr[currentQIndex]=(i===q.correctTargetIndex); renderCurrentQuiz(); updateScoreUI();}}; tad.appendChild(b);});
        const tf=document.getElementById('techFeedback'); if(sti!==null){if(techCorrectArr[currentQIndex]) tf.innerHTML=`<div class="fb-correct">✅ 正確！此段落使用 ${q.correctTech}。</div>`; else tf.innerHTML=`<div class="fb-wrong">❌ 手法錯誤。正確答案是 ${q.correctTech}。</div>`;} else tf.innerHTML='<div class="feedback-area" style="background:#eef2ff;">✨ 請選擇一個說明手法。</div>';
        const pf=document.getElementById('targetFeedback'); if(stai!==null){if(targetCorrectArr[currentQIndex]) pf.innerHTML=`<div class="fb-correct">🎯 正確！說明對象/目的：${q.targetOptions[q.correctTargetIndex]}。</div>`; else pf.innerHTML=`<div class="fb-wrong">⚠️ 答案錯誤。正確的是：${q.targetOptions[q.correctTargetIndex]}。</div>`;} else pf.innerHTML='<div class="feedback-area" style="background:#eef2ff;">📌 請選出這段文字說明的對象/目的。</div>';
        document.getElementById('questionCounter').innerText=`第${currentQIndex+1} / ${QUESTIONS.length}題`;
        const p=document.getElementById('prevBtn'), n=document.getElementById('nextBtn'), r=document.getElementById('resetQuizBtn');
        if(p){const np=p.cloneNode(true); p.parentNode.replaceChild(np,p); np.onclick=()=>{if(currentQIndex>0){currentQIndex--; renderCurrentQuiz();}else alert('已在第一題');};}
        if(n){const nn=n.cloneNode(true); n.parentNode.replaceChild(nn,n); nn.onclick=()=>{if(currentQIndex<QUESTIONS.length-1){currentQIndex++; renderCurrentQuiz();}else alert(`🎉 完成16題！總分 ${computeTotal()}/32`);};}
        if(r){const nr=r.cloneNode(true); r.parentNode.replaceChild(nr,r); nr.onclick=()=>{userTechAns.fill(null); userTargetAns.fill(null); techCorrectArr.fill(false); targetCorrectArr.fill(false); currentQIndex=0; renderCurrentQuiz(); updateScoreUI();};}
    }
    function init(){refreshShuffledLists(); renderMatchGame(); updatePairedSummary(); document.getElementById('resetMatchBtn').onclick=resetMatch; renderCurrentQuiz(); updateScoreUI();}
    init();
</script>
</body>
</html>
